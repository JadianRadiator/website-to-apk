name: Build WebAPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # REQUIRED: make.sh explicitly expects ./cmdline-tools
      - name: Install Android cmdline-tools (correct structure)
        run: |
          mkdir -p cmdline-tools

          curl -L -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip tools.zip -d cmdline-tools

          # normalize structure so sdkmanager exists where expected
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/

      # REQUIRED: adb fix
      - name: Install adb
        run: |
          sudo apt-get update
          sudo apt-get install -y adb

      - name: Make scripts executable
        run: |
          chmod +x make.sh
          chmod +x gradlew

      - name: Run build
        run: |
          ./make.sh try

      # DEBUG STEP: show where outputs actually went
      - name: Locate build outputs
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" || true

          echo "=== OUTPUT DIRECTORIES ==="
          find . -type d -path "*build/outputs*" || true

      # SAFE COLLECTION: grab anything built anywhere
      - name: Collect build artifacts
        run: |
          mkdir -p artifact_out

          echo "Collecting APKs..."
          find . -type f -name "*.apk" -exec cp --parents {} artifact_out/ \; || true

          echo "Collecting AABs..."
          find . -type f -name "*.aab" -exec cp --parents {} artifact_out/ \; || true

          echo "Final artifact tree:"
          find artifact_out || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapk-build
          path: artifact_out
