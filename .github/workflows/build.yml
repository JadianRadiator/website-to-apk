name: Build WebAPK (GFN hardened)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk bash

      - name: Setup cmdline-tools (repo compatibility)
        run: |
          mkdir -p cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      - name: Prepare make.sh
        run: chmod +x make.sh

      # -----------------------------
      # KEYGEN (isolated env)
      # -----------------------------
      - name: Keygen
        run: |
          bash -c '
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            ./make.sh keygen
          '

      # -----------------------------
      # FIXED BUILD (CRITICAL PATCH)
      # -----------------------------
      - name: Build APK (SDK conflict hardened)
        run: |
          bash -c '
            set -e

            # Step 1: start build in background
            ./make.sh build confs/gfn/webapk.conf &
            PID=$!

            # Step 2: wait for make.sh to override env
            sleep 6

            # Step 3: FORCE correct SDK for Gradle stage
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

            # Step 4: kill stale override flag if exists
            unset ANDROID_HOME_OVERRIDE || true

            # Step 5: wait build finish
            wait $PID
          '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/outputs/**
            **/out/**
