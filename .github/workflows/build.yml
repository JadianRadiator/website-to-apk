name: Build WebAPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # REQUIRED: make.sh expects ./cmdline-tools exactly
      - name: Install Android cmdline-tools (correct structure)
        run: |
          mkdir -p cmdline-tools

          curl -L -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip tools.zip -d cmdline-tools

          # normalize structure for sdkmanager
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/

      # REQUIRED: adb for make.sh warning
      - name: Install adb
        run: |
          sudo apt-get update
          sudo apt-get install -y adb

      - name: Make scripts executable
        run: |
          chmod +x make.sh
          chmod +x gradlew

      - name: Run build
        run: |
          ./make.sh try

      # DEBUG: confirm where Gradle actually output files
      - name: Debug build outputs
        run: |
          echo "=== Searching full workspace for APKs ==="
          find . -type f -name "*.apk" | sort || true

          echo "=== Searching Gradle output directories ==="
          find . -type d -path "*build/outputs*" | sort || true

      # SAFE COLLECTION: grab everything regardless of variant/folder
      - name: Collect build artifacts
        run: |
          mkdir -p artifact_out

          echo "Copying APKs..."
          find . -type f -name "*.apk" -exec cp --parents {} artifact_out/ \; || true

          echo "Copying AABs..."
          find . -type f -name "*.aab" -exec cp --parents {} artifact_out/ \; || true

          echo "Artifact tree:"
          find artifact_out || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapk-build
          path: artifact_out
