name: Build WebAPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Force ONLY make.sh SDK environment
        run: |
          # wipe runner SDK completely
          echo "ANDROID_HOME=" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV

          # ensure make.sh becomes the only possible source
          echo "USE_CUSTOM_SDK=true" >> $GITHUB_ENV

      - name: Make scripts executable
        run: |
          chmod +x make.sh
          chmod +x gradlew

      - name: Run make.sh build
        run: |
          ./make.sh try

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapk-build
          path: |
            **/*.apk
