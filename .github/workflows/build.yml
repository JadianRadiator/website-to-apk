name: Build WebAPK (make.sh)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bash

      - name: Ensure make.sh is executable
        run: chmod +x make.sh

      - name: Generate key (required step)
        run: |
          ./make.sh keygen

      - name: Build GFN profile APK
        run: |
          ./make.sh build confs/gfn/webapk.conf

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/**
            **/out/**
