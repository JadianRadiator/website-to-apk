name: Build WebAPK (GFN stable fixed)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 🔥 SINGLE SOURCE OF TRUTH (critical)
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk bash

      - name: Setup cmdline-tools (required by make.sh)
        run: |
          mkdir -p cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      - name: Prepare build script
        run: chmod +x make.sh

      # -----------------------------
      # KEYGEN (must match SDK)
      # -----------------------------
      - name: Generate key
        run: |
          ./make.sh keygen

      # -----------------------------
      # FINAL FIX: prevent SDK mismatch at source
      # -----------------------------
      - name: Build APK (strict SDK lock)
        run: |
          set -e

          # HARD LOCK environment BEFORE ANY GRADLE CALL
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

          # Run build normally
          ./make.sh build confs/gfn/webapk.conf

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/outputs/**
            **/out/**
