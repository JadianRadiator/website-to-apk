name: Build WebAPK (GFN stable)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk bash

      # -----------------------------
      # Install Android cmdline-tools (required by make.sh)
      # -----------------------------
      - name: Setup Android cmdline-tools (repo-local)
        run: |
          mkdir -p cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      # -----------------------------
      # Make script executable
      # -----------------------------
      - name: Prepare build script
        run: chmod +x make.sh

      # -----------------------------
      # Key generation (required by repo system)
      # -----------------------------
      - name: Generate signing key
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          ./make.sh keygen

      # -----------------------------
      # FINAL BUILD STEP (FIXED SDK CONFLICT)
      # -----------------------------
- name: Build GFN profile APK (hard override fix)
  run: |
    bash -c '
      ./make.sh build confs/gfn/webapk.conf &
      PID=$!

      # Wait until make.sh sets env + reaches gradle stage
      sleep 8

      # FORCE environment correction (this is the fix)
      export ANDROID_HOME=/usr/local/lib/android/sdk
      export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

      # Kill any inherited bad env from make.sh child process
      unset ANDROID_HOME_OVERRIDE || true

      wait $PID
    '
      # -----------------------------
      # Upload output
      # -----------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/outputs/**
            **/out/**
