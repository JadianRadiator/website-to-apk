name: Build WebAPK (GFN Stable CI)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # System dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk bash

      # -----------------------------
      # Install repo-required cmdline-tools
      # (needed because make.sh expects ./cmdline-tools)
      # -----------------------------
      - name: Setup cmdline-tools (repo compatibility layer)
        run: |
          mkdir -p cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      # -----------------------------
      # Prepare make script
      # -----------------------------
      - name: Prepare make.sh
        run: chmod +x make.sh

      # -----------------------------
      # KEYGEN
      # -----------------------------
      - name: Generate signing key
        run: |
          bash -c '
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            ./make.sh keygen
          '

      # -----------------------------
      # BUILD (CRITICAL FIX: SDK ALIGNMENT)
      # -----------------------------
      - name: Build APK (SDK alignment fix)
        run: |
          bash -c '
            set -e

            # Run build normally (let make.sh define ANDROID_HOME first)
            ./make.sh build confs/gfn/webapk.conf

            # AFTER make.sh runs, force alignment for Gradle consistency
            export ANDROID_HOME=/home/runner/work/website-to-apk/website-to-apk/cmdline-tools
            export ANDROID_SDK_ROOT=/home/runner/work/website-to-apk/website-to-apk/cmdline-tools

            echo "[CI] SDK unified to make.sh path:"
            echo $ANDROID_HOME
          '

      # -----------------------------
      # Upload output
      # -----------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/outputs/**
            **/out/**
