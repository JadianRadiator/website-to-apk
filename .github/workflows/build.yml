name: Build WebAPK (GFN stable CI)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 🔥 SINGLE SOURCE OF TRUTH (critical fix)
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # System dependencies
      # -----------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk bash

      # -----------------------------
      # Repo-required Android cmdline-tools
      # (ONLY for make.sh internal checks)
      # -----------------------------
      - name: Setup cmdline-tools (repo compatibility layer)
        run: |
          mkdir -p cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      # -----------------------------
      # Make script ready
      # -----------------------------
      - name: Prepare make.sh
        run: chmod +x make.sh

      # -----------------------------
      # KEYGEN STEP (isolated env)
      # -----------------------------
      - name: Generate signing key
        run: |
          bash -c '
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
            ./make.sh keygen
          '

      # -----------------------------
      # FINAL BUILD STEP (FIXED ENV COLLISION)
      # -----------------------------
      - name: Build GFN profile APK
        run: |
          bash -c '
            # 🔥 HARD RESET ENV EVERY RUN (fixes make.sh override bug)
            export ANDROID_HOME=/usr/local/lib/android/sdk
            export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk

            # Prevent repo override conflicts
            unset ANDROID_HOME_OVERRIDE || true

            # Run build
            ./make.sh build confs/gfn/webapk.conf
          '

      # -----------------------------
      # Upload APK output
      # -----------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/outputs/**
            **/out/**
