name: Build WebAPK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # REQUIRED: make.sh explicitly looks for ./cmdline-tools
      - name: Install Android cmdline-tools (local for make.sh)
        run: |
          mkdir -p cmdline-tools

          curl -L -o tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip

          unzip tools.zip -d cmdline-tools

          # normalize folder structure to what sdkmanager expects
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      # REQUIRED: adb missing fix
      - name: Install adb (platform-tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y adb

      - name: Make scripts executable
        run: |
          chmod +x make.sh
          chmod +x gradlew

      - name: Run build
        run: |
          ./make.sh try

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapk-build
          path: |
            **/*.apk
