name: Build WebAPK (make.sh fixed)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip openjdk-17-jdk

      # ----------------------------
      # CRITICAL FIX: create expected local SDK path
      # ----------------------------
      - name: Setup local cmdline-tools (REQUIRED BY make.sh)
        run: |
          mkdir -p cmdline-tools

          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip tools.zip -d cmdline-tools

          # Fix folder nesting (VERY IMPORTANT)
          mv cmdline-tools/cmdline-tools cmdline-tools/latest

      # ----------------------------
      # Ensure expected Android structure exists
      # ----------------------------
      - name: Create platform-tools stub (if needed)
        run: |
          mkdir -p platform-tools

      - name: Verify structure
        run: |
          ls -R cmdline-tools

      - name: Make build script executable
        run: chmod +x make.sh

      - name: Generate key
        run: ./make.sh keygen

      - name: Build GFN profile
        run: ./make.sh build confs/gfn/webapk.conf

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gfn-webapk
          path: |
            **/*.apk
            **/build/**
            **/out/**
